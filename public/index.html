<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Password</title>
  <meta name="description" content="Lấy mật khẩu master, copy và theo dõi thời gian hiệu lực.">
  <style>
    :root {color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecf4fa;background:#091119}
    * {box-sizing:border-box} body {margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#123440 0,transparent 60%),#091119}
    main {width:min(100%,430px);padding:40px 32px 28px;border:1px solid #263a46;border-radius:24px;background:#101c26;box-shadow:0 24px 80px #0004;text-align:center}
    .icon {display:grid;place-items:center;width:60px;height:60px;margin:0 auto 24px;border:1px solid #35716f;border-radius:18px;background:#173c3d;color:#7aefdb}
    h1 {font-size:26px;letter-spacing:-.7px;margin:0 0 10px;font-weight:650} .sub {font-size:14px;line-height:1.6;color:#9ab0bf;margin:0 0 30px}
    button {width:100%;min-height:52px;border:0;border-radius:12px;background:#83eed7;color:#09221e;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,transform .15s}
    button:hover {background:#a0f6e5} button:active {transform:translateY(1px)} button:disabled {opacity:.65;cursor:wait} button:focus-visible {outline:3px solid #ecf4fa;outline-offset:4px}
    [hidden] {display:none!important} #active {padding:8px 0 6px} #seconds {font-size:64px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:0 0 12px}
    .timer-label {margin:0;font-size:14px;color:#a7bcc9} .track {height:5px;overflow:hidden;background:#22333f;border-radius:8px;margin-top:24px} #progress {height:100%;width:100%;background:#83eed7;transition:width .2s linear}
    #status {font-size:13px;line-height:1.65;min-height:22px;margin:20px 0 0;color:#9ab0bf} #status.error {color:#ffb1ad} #status.success {color:#83eed7}
    textarea {width:100%;margin-top:18px;padding:12px;background:#091119;color:#ecf4fa;border:1px solid #536b7a;border-radius:10px;font-family:monospace;resize:none}
    footer {margin-top:28px;padding-top:20px;border-top:1px solid #263440;color:#7792a4;font-size:11px;letter-spacing:.1px}
    @media(max-width:440px){main{padding:32px 24px}body{padding:16px}}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.5"/><path d="m11.2 11.2 9 9M16 16l2.5-2.5M18.5 18.5 21 16"/></svg></div>
    <h1>Master Password</h1>
    <p class="sub">Lấy mật khẩu và copy ngay vào clipboard.</p>
    <section id="active" hidden aria-label="Thời gian còn hiệu lực">
      <p id="seconds">0</p><p class="timer-label">giây còn hiệu lực</p>
      <div class="track" aria-hidden="true"><div id="progress"></div></div>
    </section>
    <button id="get" type="button">Get master password</button>
    <textarea id="manual" rows="2" readonly hidden aria-label="Mật khẩu để copy thủ công" spellcheck="false" autocomplete="off"></textarea>
    <p id="status" role="status" aria-live="polite">Sẵn sàng lấy mật khẩu.</p>
    <footer>ASC · Tiện ích mật khẩu master · <span id="app-version">v__APP_VERSION__</span><span id="server-version"></span></footer>
  </main>
  <script>
    const APP_VERSION = '__APP_VERSION__';
    const serverVersion = document.getElementById('server-version');
    const button = document.getElementById('get');
    const active = document.getElementById('active');
    const seconds = document.getElementById('seconds');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const manual = document.getElementById('manual');
    let secret = '', lifetime = 0, wallStart = 0, monotonicStart = 0, timer;
    const remaining = () => Math.max(0, lifetime - Math.max(Date.now() - wallStart, performance.now() - monotonicStart));
    const message = (text, type = '') => {status.textContent = text; status.className = type;};
    function expire() {
      clearInterval(timer); secret = ''; manual.value = ''; manual.hidden = true; active.hidden = true;
      button.hidden = false; button.disabled = false; button.textContent = 'Get master password';
      message('Mã đã hết hiệu lực. Bấm nút để lấy mã tiếp theo.');
    }
    function tick() {
      const ms = remaining();
      if (ms < 1000) {expire(); return;}
      seconds.textContent = String(Math.floor(ms / 1000));
      progress.style.width = `${Math.min(100, ms / 3000)}%`;
    }
    async function copy() {
      if (!secret || remaining() < 1000) return expire();
      try {
        await navigator.clipboard.writeText(secret);
        if (!secret || remaining() < 1000) return expire();
        manual.hidden = true; manual.value = ''; button.hidden = true;
        message('Đã copy vào clipboard.', 'success');
      } catch {
        if (!secret || remaining() < 1000) return expire();
        manual.value = secret; manual.hidden = false; button.hidden = false; button.textContent = 'Copy master password';
        message('Trình duyệt chưa cho phép copy. Bấm lại hoặc copy mã bên trên.', 'error');
      }
    }
    button.addEventListener('click', async () => {
      if (secret && remaining() >= 1000) {button.disabled = true; await copy(); button.disabled = false; return;}
      button.disabled = true; button.textContent = 'Đang lấy…'; message('Đang kết nối HRM…');
      let start = performance.now();
      try {
        // Check the deployed backend before sending a request that logs into HRM.
        const versionResponse = await fetch('/api/version', {cache:'no-store',credentials:'same-origin',signal:AbortSignal.timeout(10000)}).catch(()=>{throw new Error('VERSION_UNAVAILABLE');});
        let info;
        try {info=await versionResponse.json();} catch {throw new Error('VERSION_UNAVAILABLE');}
        if (!versionResponse.ok || !/^\d+\.\d+\.\d+$/.test(info?.version)) throw new Error('VERSION_UNAVAILABLE');
        serverVersion.textContent = ` · Server v${info.version}`;
        if (info.version !== APP_VERSION) throw new Error('VERSION_MISMATCH');
        start = performance.now();
        const response = await fetch('/api/master-password', {
          method:'POST', headers:{'X-Master-Request':'1','X-App-Version':APP_VERSION}, credentials:'same-origin', cache:'no-store', signal:AbortSignal.timeout(65000)
        });
        let data;
        try { data = await response.json(); } catch { throw new Error('API_INVALID_RESPONSE'); }
        if (data.version !== APP_VERSION) throw new Error('VERSION_MISMATCH');
        if (!response.ok) throw Object.assign(new Error(data.error || 'HRM_UNAVAILABLE'),{diagnostic:data});
        const processing = Number.isFinite(data.processingMs) && data.processingMs >= 0 ? data.processingMs : 0;
        const transit = Math.max(0, performance.now() - start - processing);
        const ms = data.remainingMs - transit;
        if (typeof data.password !== 'string' || !data.password.trim() || !Number.isFinite(ms) || ms < 1000 || ms > 300000) throw new Error('INVALID_RESPONSE');
        secret = data.password; lifetime = ms; wallStart = Date.now(); monotonicStart = performance.now();
        active.hidden = false; tick(); clearInterval(timer); timer = setInterval(tick, 250);
        await copy();
      } catch (error) {
        const errors = {
          VERSION_MISMATCH:'Giao diện và server khác phiên bản. Tải lại trang hoặc mở deployment mới nhất.',
          VERSION_UNAVAILABLE:'Chưa xác nhận được phiên bản server. Kiểm tra deployment và thử lại.',
          NOT_CONFIGURED:'Chưa cấu hình tài khoản HRM trên server.',
          UNSUPPORTED_RUNTIME:'API cần chạy trên Vercel hoặc server local đi kèm.',
          LOGIN_FAILED:'Không đăng nhập được HRM. Kiểm tra tài khoản trên Vercel.',
          AUTH_BLOCKED:'HRM đang yêu cầu xác minh hoặc chặn truy cập tự động.',
          LOGIN_REQUIRED:'HRM yêu cầu phương thức đăng nhập khác.',
          HRM_UI_CHANGED:'Chưa thao tác được giao diện HRM. Kiểm tra bước lỗi bên dưới.',
          COPY_FAILED:'HRM chưa cung cấp được mã để copy.',
          HRM_TIMEOUT:'HRM phản hồi quá lâu. Vui lòng thử lại sau.',
          BROWSER_START_FAILED:'Chromium không khởi chạy được trên server.',
          BROWSER_SETUP_FAILED:'Không thiết lập được trình duyệt hoặc quyền clipboard.',
          HRM_CONNECTION_FAILED:'Server không kết nối được đến HRM.',
          HRM_ACCESS_DENIED:'HRM từ chối truy cập từ server.',
          CLIPBOARD_UNAVAILABLE:'Clipboard của trình duyệt server chưa hoạt động.',
          API_INVALID_RESPONSE:'API không trả JSON. Kiểm tra deployment và Runtime Logs.',
          HRM_UNAVAILABLE:'Backend gặp lỗi khi lấy mã HRM.',
          BROWSER_UNAVAILABLE:'Server chưa khởi chạy được trình duyệt HRM.',
          INVALID_CONFIGURATION:'Cấu hình API HRM chưa hợp lệ.',
          FORBIDDEN:'Kết nối không được cấp quyền.',
          TRY_AGAIN:'Vui lòng đợi vài giây rồi thử lại.',
          INVALID_RESPONSE:'HRM chưa trả về mã và thời gian hiệu lực hợp lệ.'
        };
        const d=error.diagnostic;
        // Display only diagnostic labels, never arbitrary server text.
        const details=d && /^[a-z_]{1,40}$/.test(d.stage) && /^[A-Z0-9_]{1,40}$/.test(d.reason) &&
          /^[a-f0-9-]{36}$/.test(d.requestId) ? ` [${error.message}: ${d.stage}/${d.reason}; ID ${d.requestId}]` : '';
        message((errors[error.message] || 'Không lấy được mật khẩu. Vui lòng thử lại.')+details, 'error');
        button.textContent = 'Get master password';
      } finally {button.disabled = false;}
    });
    document.addEventListener('visibilitychange', () => {if (secret) tick();});
    window.addEventListener('pageshow', () => {if (secret) tick();});
    window.addEventListener('pagehide', expire);
  </script>
</body>
</html>
